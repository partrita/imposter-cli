name: deploy-pages

on:
  push:
    branches:
      - main
    paths:
      - 'book.toml'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build with mdBook
        run: mdbook build

      # Re-run 시 중복 아티팩트가 생성되어 deploy-pages 단계가 실패하는 현상 방지
      - name: Delete stale 'github-pages' artifacts (if re-running)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name: 'github-pages',
              });
              for (const artifact of data.artifacts) {
                core.info(`Deleting stale artifact ${artifact.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            } catch (err) {
              core.warning(`Artifact cleanup check failed: ${err.message}`);
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

