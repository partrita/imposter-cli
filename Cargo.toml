[package]
name = "imposter"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "A zero-dependency CLI that fakes a Claude Code session so you look busy. Satire."
license = "MIT"
repository = "https://github.com/partrita/imposter-cli"
homepage = "https://github.com/partrita/imposter-cli"
readme = "README.md"
keywords = ["cli", "satire", "fake", "demo", "terminal"]
categories = ["command-line-utilities"]
exclude = [
    "assets/*",
    ".github/*",
    "Dockerfile",
    "flake.nix",
    "flake.lock",
    "rust-toolchain.toml",
    "target/*",
]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

# TUI is optional: `--no-default-features` builds the tiny 345 KB version.
[dependencies]
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28.1", optional = true }
ctrlc = "3.5.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
